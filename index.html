<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CountDown</title>
  
  <!-- 引入 Google Fonts（七段顯示器與多款科技/數位字體） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Press+Start+2P&family=Share+Tech+Mono&family=VT323&family=VT323&display=swap" rel="stylesheet">

  <style>
    /* 七段顯示器字體 (7-Segment) */
    @font-face {
      font-family: 'SevenSegment';
      src: url('https://cdnjs.cloudflare.com/ajax/libs/fittext.js/1.2.0/fittext.min.js') format('woff'); /* fallback identifier */
      src: url('https://fonts.cdnfonts.com/s/16142/D7M.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      font-family: 'SevenSegment', 'Orbitron', monospace;
    }

    /* 置中主容器 */
    .timer-container {
      width: 100vw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      background-color: #000000;
      cursor: pointer;
    }

    /* 大數字樣式 */
    .timer-display {
      font-size: min(55vw, 55vh);
      font-weight: 400;
      line-height: 1;
      text-align: center;
      letter-spacing: -0.04em; /* 縮短數字間距 */
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
      white-space: nowrap;
      transition: font-family 0.2s ease;
      font-family: 'SevenSegment', sans-serif;
    }

    /* 字體類別 */
    .font-f1 { font-family: 'SevenSegment', sans-serif; letter-spacing: -0.02em; }
    .font-f2 { font-family: 'Orbitron', sans-serif; letter-spacing: -0.06em; }
    .font-f3 { font-family: 'VT323', monospace; letter-spacing: 0.02em; }
    .font-f4 { font-family: 'Share Tech Mono', monospace; letter-spacing: -0.05em; }
    .font-f5 { font-family: 'Press Start 2P', cursive; letter-spacing: -0.1em; font-size: min(40vw, 40vh); }

    /* 極簡抽屜式設定選單 */
    .settings-drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: #000000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      transform: translateX(-100%);
      transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
      z-index: 10;
      padding: 20px;
    }

    .settings-drawer.open {
      transform: translateX(0);
    }

    /* 字體選擇按鈕列 */
    .font-options {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .font-btn {
      background: #111111;
      border: 1px solid #333333;
      color: #888888;
      padding: 10px 16px;
      font-size: 16px;
      font-family: monospace;
      border-radius: 4px;
      cursor: pointer;
    }

    .font-btn.active {
      color: #ffffff;
      border-color: #ffffff;
      background: #222222;
    }

    /* 預設數字按鈕網格 */
    .presets-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 280px;
    }

    .preset-btn {
      background: #111111;
      border: 1px solid #222222;
      color: #ffffff;
      padding: 16px 0;
      font-size: 24px;
      font-family: monospace;
      border-radius: 6px;
      text-align: center;
      cursor: pointer;
    }

    .preset-btn:active {
      background: #333333;
    }

    /* 數字輸入框 */
    .input-box {
      width: 100%;
      max-width: 280px;
      background: #111111;
      border: 1px solid #333333;
      color: #ffffff;
      font-size: 32px;
      padding: 10px;
      text-align: center;
      font-family: monospace;
      border-radius: 6px;
      outline: none;
    }

    /* 設定確認按鈕 */
    .set-btn {
      width: 100%;
      max-width: 280px;
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 16px 0;
      font-size: 22px;
      font-weight: bold;
      font-family: sans-serif;
      border-radius: 6px;
      cursor: pointer;
    }

    .set-btn:active {
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <!-- 滿版計時器 display -->
  <div class="timer-container" id="timerContainer">
    <div class="timer-display font-f1" id="timerDisplay">30</div>
  </div>

  <!-- 設定抽屜 (從左向右滑動拉出) -->
  <div class="settings-drawer" id="settingsDrawer">
    <!-- 字體風格選擇 -->
    <div class="font-options">
      <button class="font-btn active" onclick="selectFont('f1', this)">F1</button>
      <button class="font-btn" onclick="selectFont('f2', this)">F2</button>
      <button class="font-btn" onclick="selectFont('f3', this)">F3</button>
      <button class="font-btn" onclick="selectFont('f4', this)">F4</button>
      <button class="font-btn" onclick="selectFont('f5', this)">F5</button>
    </div>

    <!-- 預設常用秒數 -->
    <div class="presets-grid">
      <div class="preset-btn" onclick="selectPreset(5)">5</div>
      <div class="preset-btn" onclick="selectPreset(10)">10</div>
      <div class="preset-btn" onclick="selectPreset(30)">30</div>
      <div class="preset-btn" onclick="selectPreset(60)">60</div>
      <div class="preset-btn" onclick="selectPreset(120)">120</div>
      <div class="preset-btn" onclick="selectPreset(300)">300</div>
    </div>

    <!-- 自訂秒數輸入 -->
    <input type="number" id="customInput" class="input-box" value="30" min="1" max="9999" pattern="[0-9]*" inputmode="numeric">

    <!-- 確認套用 -->
    <button class="set-btn" onclick="applySettings()">Set</button>
  </div>

  <script>
    // 狀態變數
    let defaultSeconds = 30;
    let currentSeconds = 30;
    let isRunning = false;
    let timerInterval = null;
    let selectedFontClass = 'font-f1';

    // DOM 元素
    const timerContainer = document.getElementById('timerContainer');
    const timerDisplay = document.getElementById('timerDisplay');
    const settingsDrawer = document.getElementById('settingsDrawer');
    const customInput = document.getElementById('customInput');

    // 畫面更新
    function updateDisplay() {
      timerDisplay.textContent = currentSeconds;
    }

    // 觸發結束 3 下短震動
    function triggerEndVibration() {
      if ('vibrate' in navigator) {
        // [震動, 暫停, 震動, 暫停, 震動]
        navigator.vibrate([100, 100, 100, 100, 100]);
      }
    }

    // 開始計時
    function startTimer() {
      if (isRunning) return;
      if (currentSeconds <= 0) {
        currentSeconds = defaultSeconds;
        updateDisplay();
      }
      isRunning = true;
      timerInterval = setInterval(() => {
        if (currentSeconds > 0) {
          currentSeconds--;
          updateDisplay();
          if (currentSeconds === 0) {
            pauseTimer();
            triggerEndVibration();
          }
        } else {
          pauseTimer();
        }
      }, 1000);
    }

    // 暫停計時
    function pauseTimer() {
      isRunning = false;
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
    }

    // 切換暫停 / 開始
    function toggleTimer() {
      if (settingsDrawer.classList.contains('open')) {
        closeDrawer();
        return;
      }
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    // 重置並繼續倒數 (由右向左滑動)
    function resetAndStart() {
      pauseTimer();
      currentSeconds = defaultSeconds;
      updateDisplay();
      startTimer();
    }

    // 開啟設定選單 (由左向右滑動)
    function openDrawer() {
      pauseTimer();
      customInput.value = defaultSeconds;
      settingsDrawer.classList.add('open');
    }

    // 關閉設定選單
    function closeDrawer() {
      settingsDrawer.classList.remove('open');
    }

    // 設定預設秒數
    function selectPreset(sec) {
      customInput.value = sec;
    }

    // 設定字體選擇
    function selectFont(fontKey, btn) {
      document.querySelectorAll('.font-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedFontClass = 'font-' + fontKey;
    }

    // 套用新設定
    function applySettings() {
      const val = parseInt(customInput.value, 10);
      if (!isNaN(val) && val > 0) {
        defaultSeconds = val;
        currentSeconds = val;
      }
      // 套用字體樣式
      timerDisplay.className = 'timer-display ' + selectedFontClass;
      
      updateDisplay();
      closeDrawer();
      startTimer();
    }

    // 手勢觸控邏輯 (Tap, Swipe Left, Swipe Right)
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.touches.length > 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      const elapsedTime = Date.now() - touchStartTime;

      // 如果點擊在設定 Drawer 內部，不觸發手勢
      if (settingsDrawer.contains(e.target) && settingsDrawer.classList.contains('open')) {
        return;
      }

      // 手勢判斷閾值
      const minSwipeDistance = 50;
      const maxOffAxisDistance = 80;

      if (Math.abs(deltaX) > minSwipeDistance && Math.abs(deltaY) < maxOffAxisDistance && elapsedTime < 500) {
        if (deltaX < 0) {
          // 右向左滑：Reset 並繼續倒數
          resetAndStart();
        } else {
          // 左向右滑：開啟設定
          openDrawer();
        }
      } else if (Math.abs(deltaX) < 10 && Math.abs(deltaY) < 10) {
        // 純點擊：暫停或開始
        toggleTimer();
      }
    }, { passive: true });

    // 初始化自動啟動
    updateDisplay();
    startTimer();
  </script>
</body>
</html>
